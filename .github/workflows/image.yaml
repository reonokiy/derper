name: Build and publish DERP image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: derper-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Build pinned Linux amd64 image
        run: docker build --pull --platform linux/amd64 --tag ghcr.io/reonokiy/derper:sha-${GITHUB_SHA} .

      - name: Check binary startup and version
        run: |
          version=$(docker run --rm ghcr.io/reonokiy/derper:sha-${GITHUB_SHA} -version)
          case "$version" in
            1.102.4-*) printf 'derper %s\n' "$version" ;;
            *) printf 'unexpected derper version: %s\n' "$version" >&2; exit 1 ;;
          esac

      - name: Publish immutable commit tag
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker push ghcr.io/reonokiy/derper:sha-${GITHUB_SHA}
